# Publishes the npm package for an existing GitHub release. The package's
# install script downloads that release's binaries.
#
# This is the workflow npm's trusted publisher (OIDC) is configured for, so
# every npm publish has to run here, as a run of its own: release.yml starts
# it with `gh workflow run` on the release tag, and it can also be run by hand
# (on the tag, or with `version`) to retry one.

name: Release npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (default the workspace version at the chosen ref)
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  release-npm:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing npm package for version: $VERSION"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Update npm
        run: npm install -g npm@latest

      - name: Create npm package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The package's files are kept in crates/fresh-editor/npm-package.
          mkdir -p dist-npm
          cp crates/fresh-editor/npm-package/*.js dist-npm/

          # Create package.json from template with version
          sed "s/VERSION_PLACEHOLDER/${VERSION}/g" crates/fresh-editor/npm-package/package.json.template > dist-npm/package.json

          # Copy supporting files. Plugins/themes are embedded in the binary.
          cp README.md LICENSE CHANGELOG.md dist-npm/

          # Create the tarball
          cd dist-npm
          npm pack
          mv *.tgz ../fresh-editor-npm-package.tar.gz
          cd ..

          echo "Created npm package:"
          ls -la fresh-editor-npm-package.tar.gz

      - name: Publish to npm with provenance (OIDC)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "Publishing npm package for version ${VERSION}"
          npm publish --access public --provenance ./fresh-editor-npm-package.tar.gz
