# Musl static builds with full features (including plugins).
# rquickjs ships pre-built bindings for musl targets and compiles QuickJS
# statically, so plugins work correctly with musl.

name: Musl Builds

on:
  workflow_call:
  workflow_dispatch:
  # The musl archive is the default Linux install and the one artifact whose
  # receipt gates self-update, so a PR that breaks it must fail the PR rather
  # than the release. Previously this workflow only ran at release time, which
  # meant the receipt step and its assertion were unverified until it was too
  # late to be cheap.
  pull_request:

jobs:
  build-musl:
    strategy:
      fail-fast: false
      matrix:
        # aarch64 cross-compiles by building `cross` from git, which dominates
        # the job. PRs get the native target — enough to prove the archive,
        # receipt and assertions are sound — and releases get both.
        target: ${{ fromJSON(github.event_name == 'pull_request' && '["x86_64-unknown-linux-musl"]' || '["x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl"]') }}
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # rust-toolchain.toml overrides the targets parameter above, so we need to explicitly add it
      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Install musl tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          # For aarch64 cross-compilation
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            # Install cross for easier cross-compilation
            cargo install cross --git https://github.com/cross-rs/cross
          fi

      - name: Build release binary
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Get version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create archive
        run: |
          ARCHIVE_NAME="fresh-editor-${{ matrix.target }}"
          mkdir -p "${ARCHIVE_NAME}"
          cp target/${{ matrix.target }}/release/fresh "${ARCHIVE_NAME}/"
          cp README.md LICENSE "${ARCHIVE_NAME}/" 2>/dev/null || true
          # Plugins/themes are embedded in the binary; no on-disk copy needed.
          cp -r docs/icons/linux/hicolor "${ARCHIVE_NAME}/icons" 2>/dev/null || true
          cp crates/fresh-editor/resources/fresh.desktop "${ARCHIVE_NAME}/fresh.desktop" 2>/dev/null || true

          # Self-update receipt. Without this a musl install resolves at
          # Heuristic confidence, and `can_self_update` refuses to swap at
          # anything below Embedded — so the one Linux artifact that runs
          # everywhere would be the one artifact that cannot update itself.
          sh scripts/write-install-receipt.sh tarball "${ARCHIVE_NAME}/install-receipt.toml" \
            target=${{ matrix.target }} \
            asset=fresh-editor-${{ matrix.target }}.tar.gz

          # gzip, deliberately, even though the dist archives use xz. This is
          # the archive `install.sh` unpacks, and install.sh shells out to the
          # system `tar` — where `.tar.xz` needs the xz binary (xz-utils),
          # which minimal images and busybox routinely lack, while gzip is
          # everywhere. The universal build has to be unpackable on a machine
          # that has nothing, so it pays the size difference for the
          # compression every system can already read: measured on CI, 13.2 MB
          # gzip against 9.9 MB xz — a third larger, ~3 MB, once per install.
          tar -czvf "${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}"
          sha256sum "${ARCHIVE_NAME}.tar.gz" > "${ARCHIVE_NAME}.tar.gz.sha256"

          # Transition shim: also publish .tar.xz.
          #
          # Binaries built before `engine::archive_ext` existed ask for
          # `fresh-editor-<triple>.tar.xz` unconditionally. That used to be
          # harmless for musl — those installs carried no receipt, so the
          # updater refused to act at all — but install.sh now writes a receipt
          # when the archive lacks one, which turns "no update offered" into
          # "update offered" for a binary that will request the xz name. Ship
          # both so that request resolves instead of 404ing.
          #
          # Droppable one release after the gzip switch ships, once no
          # published binary asks for the xz name any more.
          tar -cJvf "${ARCHIVE_NAME}.tar.xz" "${ARCHIVE_NAME}"
          sha256sum "${ARCHIVE_NAME}.tar.xz" > "${ARCHIVE_NAME}.tar.xz.sha256"

          ls -la "${ARCHIVE_NAME}.tar."*

      - name: Verify the archive carries a self-update receipt
        run: |
          ARCHIVE_NAME="fresh-editor-${{ matrix.target }}"
          receipt=$(tar -xzOf "${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}/install-receipt.toml")
          echo "$receipt"
          echo "$receipt" | grep -q 'channel = "tarball"' \
            || { echo "::error::musl archive receipt is not channel=tarball"; exit 1; }
          echo "$receipt" | grep -q 'self_update = true' \
            || { echo "::error::musl archive receipt is not self_update=true"; exit 1; }

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: artifacts-musl-${{ matrix.target }}
          path: |
            fresh-editor-${{ matrix.target }}.tar.gz
            fresh-editor-${{ matrix.target }}.tar.gz.sha256
            fresh-editor-${{ matrix.target }}.tar.xz
            fresh-editor-${{ matrix.target }}.tar.xz.sha256
