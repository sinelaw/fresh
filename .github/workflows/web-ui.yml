name: Web UI

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'crates/fresh-editor/web-ui/**'
      - 'crates/fresh-editor/src/webui/**'
      - 'crates/fresh-editor/src/app/client_pane.rs'
      - 'crates/fresh-editor/src/app/engine_data.rs'
      - 'crates/fresh-editor/examples/webui_server.rs'
      - '.github/workflows/web-ui.yml'
  push:
    branches:
      - main
      - master
      - develop
    paths:
      - 'crates/fresh-editor/web-ui/**'
      - 'crates/fresh-editor/src/webui/**'
      - 'crates/fresh-editor/src/app/client_pane.rs'
      - 'crates/fresh-editor/src/app/engine_data.rs'
      - 'crates/fresh-editor/examples/webui_server.rs'
      - '.github/workflows/web-ui.yml'

env:
  CARGO_TERM_COLOR: always

# ensure that the workflow is only triggered once per PR, subsequent pushes to the PR will cancel
# and restart the workflow. See https://docs.github.com/en/actions/using-jobs/using-concurrency
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  api:
    name: core API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Run the web host and API tests
        run: "cargo test -p fresh-editor --features web --lib webui::"

  playwright:
    name: playwright suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Read pinned Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./crates/fresh-editor/web-ui/test/package.json').devDependencies.playwright")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      # run.sh builds the bridge, npm-installs the suite's deps, runs
      # `npx playwright install chromium --with-deps` if the cache is cold,
      # starts webui_server, runs drive.mjs, and tears the server down.
      - name: Run web UI headless suite
        run: crates/fresh-editor/web-ui/test/run.sh
