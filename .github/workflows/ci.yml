name: CI

permissions:
  contents: read

on:
  pull_request:
    # The defaults, plus auto_merge_enabled: turning auto-merge on is what
    # starts the macOS and Windows tests (see `plan`).
    types: [opened, synchronize, reopened, auto_merge_enabled]
  push:
    branches:
      - main
      - master
      - develop

env:
  CARGO_TERM_COLOR: always

# ensure that the workflow is only triggered once per PR, subsequent pushes to the PR will cancel
# and restart the workflow. See https://docs.github.com/en/actions/using-jobs/using-concurrency
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# Every checkout here sets `persist-credentials: false`: these jobs compile and
# run the pull request's own code — a build.rs, a proc macro, a test — and the
# default checkout leaves the job token in `.git/config` for that code to read.
jobs:
  # Which operating systems the tests run on. Every push to a pull request runs
  # them on Linux; macOS and Windows join once the pull request has auto-merge
  # on or carries the `full-ci` label (read at the next push), and always on
  # pushes to the default branch. Nothing merges on the Linux-only run: `ci-ok`
  # reports under that name only after the full matrix ran, so until then the
  # required check stays "expected" and the pull request cannot merge.
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.plan.outputs.full }}
      os: ${{ steps.plan.outputs.os }}
    steps:
      - name: Choose the test matrix
        id: plan
        env:
          FULL: ${{ github.event_name != 'pull_request' || github.event.pull_request.auto_merge != null || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          if [ "$FULL" = true ]; then
            os='["ubuntu-latest","macos-latest","windows-latest"]'
          else
            os='["ubuntu-latest"]'
            echo "Linux only: macOS and Windows run once auto-merge is on or the pull request has the full-ci label." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "full=$FULL" >> "$GITHUB_OUTPUT"
          echo "os=$os" >> "$GITHUB_OUTPUT"

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: check formatting
        run: cargo fmt -- --check
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Plain `cargo clippy` fails the build only on error-level diagnostics
      # (deny-by-default lints, the crate's `#![deny(clippy::let_underscore_must_use)]`,
      # or compile errors) — clippy *warnings* do not fail it. The previous
      # rs-clippy-check action ran with `-D warnings`, so a clippy toolchain
      # bump that introduced new style/pedantic warnings across the existing
      # codebase turned the whole job red. Treat warnings as warnings.
      - name: Run clippy (errors fail the build; warnings are allowed)
        run: cargo clippy --all-features --all-targets
  doc:
    # run docs generation on nightly rather than stable. This enables features like
    # https://doc.rust-lang.org/beta/unstable-book/language-features/doc-cfg.html which allows an
    # API be documented as only available in some specific platforms.
    name: doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296 # nightly branch
      - name: Run cargo doc
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: --cfg docsrs
  schema:
    name: schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Generate schema
        run: cargo run --features dev-bins --bin generate_schema > /tmp/config-schema.json
      - name: Check schema is up-to-date
        run: diff -u crates/fresh-editor/plugins/config-schema.json /tmp/config-schema.json

  # fresh.d.ts and the plugin API reference (docs/plugins/api/) are generated
  # from the Rust source. Regenerate both and fail if the committed copies differ.
  plugin-api:
    name: plugin API types and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Regenerate fresh.d.ts and the API reference
        run: cargo test -p fresh-plugin-runtime --lib write_fresh_dts_file -- --ignored
      - name: Check they are up-to-date
        run: |
          if ! git diff --exit-code -- crates/fresh-editor/plugins/lib/fresh.d.ts docs/plugins/api; then
            echo "::error::fresh.d.ts or docs/plugins/api is out of date. Run: ./scripts/gen_schema.sh"
            exit 1
          fi
          untracked=$(git ls-files --others --exclude-standard -- docs/plugins/api)
          if [ -n "$untracked" ]; then
            echo "::error::New generated API pages are not committed: $untracked"
            exit 1
          fi

  check-no-plugins:
    name: check (no plugins)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check build without plugins feature
        run: cargo check --no-default-features --features runtime --all-targets

  # 1.95 stays the default for everything else here; this is the standing
  # check that the tree still compiles on current stable. Pinned rather than
  # `stable` so a Rust release cannot turn it red on its own. RUSTUP_TOOLCHAIN
  # is the only override rust-toolchain.toml respects, and keys rust-cache
  # separately. No fmt or clippy: both differ between versions.
  newer-toolchain:
    name: rust 1.98 (non-default)
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: "1.98"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust 1.98
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: "1.98"
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check
        run: cargo check --workspace --all-targets --all-features

  # install.sh is the entry point for `curl ... | sh`, and it is the one script
  # here whose failure modes users hit before they have anything else installed.
  # shellcheck's own job below lints workflow `run:` blocks only, so the
  # installer would otherwise go unlinted; these run it against a shimmed curl
  # so the network-failure paths are exercised without a network.
  installer:
    name: installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Lint install.sh
        run: shellcheck -S warning -s sh scripts/install.sh
      - name: Failure modes
        run: ./scripts/test-install-failure-modes.sh

  # Each OS's tests run in two shards: with a warm cache the build takes a few
  # minutes and running the tests takes 20-35, so splitting the run roughly
  # halves the time to a result. Every shard builds the same test binaries;
  # `--partition` picks which tests it runs, by a hash of the test's name.
  test:
    needs: plan
    runs-on: ${{ matrix.os }}
    name: test ${{ matrix.os }} (${{ matrix.shard }}/2)
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.os) }}
        shard: [1, 2]
    steps:
      # if your project needs OpenSSL, uncomment this to fix Windows builds.
      # it's commented out by default as the install command takes 5-10m.
      # - run: echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append
      #   if: runner.os == 'Windows'
      # - run: vcpkg install openssl:x64-windows-static-md
      #   if: runner.os == 'Windows'
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
      # Both shards build the same thing; one saving the cache is enough.
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ matrix.shard == 1 }}
      - name: Install cargo-nextest
        uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2
        with:
          tool: cargo-nextest
      # Install Vulkan + Xvfb for headless GPU testing (Linux only).
      # openssh-server/client back the remote-mode SSH terminal integration
      # test (tests/remote_ssh_terminal.rs), which spins up a throwaway
      # non-root sshd on localhost; it skips itself if these are absent.
      - name: Install Vulkan and Xvfb
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 xvfb libxkbcommon-x11-0 openssh-server openssh-client
      # enable this ci template to run regardless of whether the lockfile is checked in or not
      - name: cargo generate-lockfile
        if: hashFiles('Cargo.lock') == ''
        run: cargo generate-lockfile
      - name: Run tests (Linux — headless with Xvfb + lavapipe)
        if: runner.os == 'Linux'
        run: xvfb-run cargo nextest run -j=4 --partition hash:${{ matrix.shard }}/2 --no-fail-fast --locked --all-features --all-targets
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          WGPU_BACKEND: "vulkan"
      - name: Run tests
        if: runner.os != 'Linux'
        run: cargo nextest run -j=4 --partition hash:${{ matrix.shard }}/2 --no-fail-fast --locked --all-features --all-targets

  # Fresh as a Debian package would build it, inside a Debian testing
  # container so every system tool is what Debian ships:
  #
  # - the plugin runtime on Debian's own QuickJS (libquickjs), through
  #   fresh-js's system backend, selected with `--cfg fresh_js_system` rather
  #   than a cargo feature so the --all-features jobs above never need
  #   libquickjs;
  # - plugin TypeScript compiled by Debian's `esbuild` instead of oxc (whose
  #   crates Debian does not package): the `oxc` feature is off.
  #
  # The editor is built with the Debian package's features (runtime, plugins,
  # embed-plugins, precompiled-plugins: no tree-sitter, http, self-update or
  # oxc). The job also checks that Debian testing's archive can supply every
  # Rust dependency of that build. The Debian package itself (packaging/debian) is built by
  # debian-package.yml.
  # See docs/internal/debian-quickjs-spike.md.
  system-quickjs:
    name: Debian build (system QuickJS, esbuild)
    runs-on: ubuntu-latest
    container: debian:testing
    # cargo test has no per-test timeout; cap the job so a hang fails it
    # instead of holding a runner for hours.
    timeout-minutes: 60
    env:
      # rustdoc (doctests) reads RUSTDOCFLAGS, not RUSTFLAGS; both must select
      # the backend or doctests build fresh-js against the absent rquickjs.
      RUSTFLAGS: --cfg fresh_js_system
      RUSTDOCFLAGS: --cfg fresh_js_system
    steps:
      - name: Install libquickjs, esbuild and build tools
        run: |
          apt-get update
          # python3: the e2e tests' fake LSP server and devcontainer helpers.
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential pkg-config libclang-dev libquickjs esbuild python3
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Engine boundary, TypeScript (esbuild) and plugin runtime
        run: cargo test --locked -p fresh-js -p fresh-core -p fresh-parser-js -p fresh-plugin-runtime --no-default-features --features fresh-core/plugins
      - name: Editor plugin tests (Debian package features)
        env:
          FRESH_REQUIRE_PRECOMPILED_PLUGINS: "1"
        run: cargo test --locked -p fresh-editor --no-default-features --features runtime,plugins,embed-plugins,precompiled-plugins --test all_tests plugin
      # Every bundled plugin has build-time JavaScript, so the package runs
      # them without esbuild.
      - name: Bundled plugins are precompiled
        env:
          FRESH_REQUIRE_PRECOMPILED_PLUGINS: "1"
        run: cargo test --locked -p fresh-editor --no-default-features --features runtime,plugins,embed-plugins,precompiled-plugins --lib embedded
      - name: Debian testing can supply every Rust dependency
        run: |
          curl -fsSL -o /tmp/Packages.xz https://deb.debian.org/debian/dists/testing/main/binary-amd64/Packages.xz
          python3 scripts/debian.py check /tmp/Packages.xz --features runtime,plugins,embed-plugins,precompiled-plugins

  # The release pipeline gets one shot per tag: a typo in a workflow expression
  # or a `run:` block surfaces when a release is already half-published, where
  # immutability means it cannot be fixed in place. This is the check that keeps
  # that class of mistake in a pull request instead.
  #
  # Pinned and checksummed rather than piped from a URL, for the same reason the
  # updater checksums what it downloads. shellcheck is preinstalled on the
  # runner; it lints every `run:` block, restricted to warnings and above so the
  # pre-existing style findings do not drown the real ones.
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install actionlint
        env:
          VERSION: 1.7.7
          SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
        run: |
          url="https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o actionlint.tar.gz "$url"
          echo "${SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
      - name: Lint workflows
        env:
          SHELLCHECK_OPTS: -S warning
        run: ./actionlint -no-color -oneline -shellcheck shellcheck

  supply-chain:
    name: supply-chain audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install cargo-deny
        uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2
        with:
          tool: cargo-deny
      - name: Check sources and licenses
        run: cargo deny --all-features check sources licenses

  # Kept out of `ci-ok`: a new RustSec advisory turns this red on every pull
  # request at once, whatever the pull request changed.
  advisories:
    name: advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install cargo-deny
        uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2
        with:
          tool: cargo-deny
      - name: Check advisories
        run: cargo deny --all-features check advisories

  # The ruleset requires the per-OS names `test <os>` from before the tests
  # were sharded; these report the sharded matrix under them. Each mirrors the
  # whole matrix, so a failing shard on one OS fails them all. Remove once the
  # ruleset requires `ci-ok` instead.
  test-rollup:
    name: test ${{ matrix.os }}
    if: always()
    needs: [plan, test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.os || '["ubuntu-latest"]') }}
    steps:
      - name: Every test shard passed
        env:
          RESULT: ${{ needs.test.result }}
        run: test "$RESULT" = success

  # The one check the ruleset needs to require: it fails unless every job above
  # succeeded, so adding, renaming or sharding a job never touches the ruleset.
  # `always()` rather than `!cancelled()`: a skipped required check counts as
  # passing, so this must run, and fail, when anything it needs was cancelled
  # or skipped. On a Linux-only run it reports under another name, so the
  # required `ci-ok` is only ever satisfied by a run that tested every OS.
  ci-ok:
    name: ${{ needs.plan.outputs.full == 'true' && 'ci-ok' || 'ci-ok (Linux only)' }}
    if: always()
    needs:
      - plan
      - fmt
      - clippy
      - doc
      - schema
      - plugin-api
      - check-no-plugins
      - newer-toolchain
      - installer
      - test
      - system-quickjs
      - actionlint
      - supply-chain
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"' <<< "$NEEDS")
          if [ -n "$failed" ]; then
            while IFS= read -r line; do echo "::error::$line"; done <<< "$failed"
            exit 1
          fi
