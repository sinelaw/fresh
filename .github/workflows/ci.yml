name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - develop

env:
  CARGO_TERM_COLOR: always

# ensure that the workflow is only triggered once per PR, subsequent pushes to the PR will cancel
# and restart the workflow. See https://docs.github.com/en/actions/using-jobs/using-concurrency
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# Every checkout here sets `persist-credentials: false`: these jobs compile and
# run the pull request's own code — a build.rs, a proc macro, a test — and the
# default checkout leaves the job token in `.git/config` for that code to read.
jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: check formatting
        run: cargo fmt -- --check
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Plain `cargo clippy` fails the build only on error-level diagnostics
      # (deny-by-default lints, the crate's `#![deny(clippy::let_underscore_must_use)]`,
      # or compile errors) — clippy *warnings* do not fail it. The previous
      # rs-clippy-check action ran with `-D warnings`, so a clippy toolchain
      # bump that introduced new style/pedantic warnings across the existing
      # codebase turned the whole job red. Treat warnings as warnings.
      - name: Run clippy (errors fail the build; warnings are allowed)
        run: cargo clippy --all-features --all-targets
  doc:
    # run docs generation on nightly rather than stable. This enables features like
    # https://doc.rust-lang.org/beta/unstable-book/language-features/doc-cfg.html which allows an
    # API be documented as only available in some specific platforms.
    name: doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296 # nightly branch
      - name: Run cargo doc
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: --cfg docsrs
  schema:
    name: schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Generate schema
        run: cargo run --features dev-bins --bin generate_schema > /tmp/config-schema.json
      - name: Check schema is up-to-date
        run: diff -u crates/fresh-editor/plugins/config-schema.json /tmp/config-schema.json

  check-no-plugins:
    name: check (no plugins)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check build without plugins feature
        run: cargo check --no-default-features --features runtime --all-targets

  # 1.95 stays the default for everything else here; this is the standing
  # check that the tree still compiles on current stable. Pinned rather than
  # `stable` so a Rust release cannot turn it red on its own. RUSTUP_TOOLCHAIN
  # is the only override rust-toolchain.toml respects, and keys rust-cache
  # separately. No fmt or clippy: both differ between versions.
  newer-toolchain:
    name: rust 1.98 (non-default)
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: "1.98"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust 1.98
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: "1.98"
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check
        run: cargo check --workspace --all-targets --all-features

  # install.sh is the entry point for `curl ... | sh`, and it is the one script
  # here whose failure modes users hit before they have anything else installed.
  # shellcheck's own job below lints workflow `run:` blocks only, so the
  # installer would otherwise go unlinted; these run it against a shimmed curl
  # so the network-failure paths are exercised without a network.
  installer:
    name: installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Lint install.sh
        run: shellcheck -S warning -s sh scripts/install.sh
      - name: Failure modes
        run: ./scripts/test-install-failure-modes.sh

  test:
    runs-on: ${{ matrix.os }}
    name: test ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # if your project needs OpenSSL, uncomment this to fix Windows builds.
      # it's commented out by default as the install command takes 5-10m.
      # - run: echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append
      #   if: runner.os == 'Windows'
      # - run: vcpkg install openssl:x64-windows-static-md
      #   if: runner.os == 'Windows'
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install cargo-nextest
        uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2
        with:
          tool: cargo-nextest
      # Install Vulkan + Xvfb for headless GPU testing (Linux only).
      # openssh-server/client back the remote-mode SSH terminal integration
      # test (tests/remote_ssh_terminal.rs), which spins up a throwaway
      # non-root sshd on localhost; it skips itself if these are absent.
      - name: Install Vulkan and Xvfb
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 xvfb libxkbcommon-x11-0 openssh-server openssh-client
      # enable this ci template to run regardless of whether the lockfile is checked in or not
      - name: cargo generate-lockfile
        if: hashFiles('Cargo.lock') == ''
        run: cargo generate-lockfile
      - name: Run tests (Linux — headless with Xvfb + lavapipe)
        if: runner.os == 'Linux'
        run: xvfb-run cargo nextest run -j=4 --no-fail-fast --locked --all-features --all-targets
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          WGPU_BACKEND: "vulkan"
      - name: Run tests
        if: runner.os != 'Linux'
        run: cargo nextest run -j=4 --no-fail-fast --locked --all-features --all-targets

  # The release pipeline gets one shot per tag: a typo in a workflow expression
  # or a `run:` block surfaces when a release is already half-published, where
  # immutability means it cannot be fixed in place. This is the check that keeps
  # that class of mistake in a pull request instead.
  #
  # Pinned and checksummed rather than piped from a URL, for the same reason the
  # updater checksums what it downloads. shellcheck is preinstalled on the
  # runner; it lints every `run:` block, restricted to warnings and above so the
  # pre-existing style findings do not drown the real ones.
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install actionlint
        env:
          VERSION: 1.7.7
          SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
        run: |
          url="https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o actionlint.tar.gz "$url"
          echo "${SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
      - name: Lint workflows
        env:
          SHELLCHECK_OPTS: -S warning
        run: ./actionlint -no-color -oneline -shellcheck shellcheck

  supply-chain:
    name: supply-chain audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install cargo-deny
        uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2
        with:
          tool: cargo-deny
      - name: Check advisories, sources and licenses
        run: cargo deny --all-features check advisories sources licenses
