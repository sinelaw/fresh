# The Debian-archive build of Fresh (packaging/debian): source and binary
# packages built the way Debian's buildds would, offline from the librust-*-dev
# packages, with Debian's cargo and rustc, Debian's QuickJS and esbuild, and no
# crates.io. See packaging/debian/README.source and
# docs/internal/debian-quickjs-spike.md.
#
# The release's main .deb is a different thing: debian/ (linux-packages.yml)
# builds it from crates.io with the default features, for any Debian or Ubuntu.
# Releases also attach this build (release.yml calls this with `release: true`),
# named so that neither the updater nor install.sh mistakes it for that one:
#
#   fresh-editor_<ver>-1_<arch>.debian-testing.deb
#   fresh-editor_<ver>-1.debian-testing-source.tar.gz  (.dsc, orig and debian
#                                                       tarballs, as dpkg-source
#                                                       -x wants them)

name: Debian package

permissions:
  contents: read

on:
  pull_request:
    # As in ci.yml: pull requests build the package once auto-merge is on or
    # they carry the `full-ci` label, not on every push. Not a required check.
    types: [opened, synchronize, reopened, auto_merge_enabled]
  push:
    branches:
      - main
      - master
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        description: Stage the packages as release assets (artifacts-* with .sha256 sidecars)
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  debian-package:
    name: Debian package (${{ matrix.suite }}, ${{ matrix.arch }})
    if: github.event_name != 'pull_request' || github.event.pull_request.auto_merge != null || contains(github.event.pull_request.labels.*.name, 'full-ci')
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: testing
            arch: amd64
            runner: ubuntu-latest
          # A native arm64 runner rather than emulation: the build compiles
          # several hundred crates and runs the package's tests.
          - suite: testing
            arch: arm64
            runner: ubuntu-24.04-arm
          # Uploads go to unstable, whose librust-*-dev packages can be ahead
          # of testing's. Built, not released.
          - suite: unstable
            arch: amd64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    container: debian:${{ matrix.suite }}
    timeout-minutes: 90
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install packaging tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git dpkg-dev lintian xz-utils

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # A `3.0 (quilt)` source package: the orig tarball is the tree as
      # committed, and packaging/debian becomes its debian/ (replacing the
      # release one, which the orig tarball also carries).
      # The package version follows the workspace's, as debian/changelog does
      # for the main .deb (scripts/update-debian-changelog.sh).
      - name: Make the orig tarball and the source tree
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cargo_version=$(awk -F'"' '/^\[workspace\.package\]/ { p = 1; next } /^\[/ { p = 0 }
            p && /^version[[:space:]]*=/ { print $2; exit }' Cargo.toml)
          sed -i "1s/([^)]*)/(${cargo_version}-1)/" packaging/debian/changelog
          version=$(dpkg-parsechangelog -l packaging/debian/changelog -S Version)
          test "$version" = "${cargo_version}-1"
          upstream=${version%-*}
          mkdir -p /build
          git archive --prefix="fresh-editor-$upstream/" HEAD | xz -T0 > "/build/fresh-editor_$upstream.orig.tar.xz"
          tar -xf "/build/fresh-editor_$upstream.orig.tar.xz" -C /build
          rm -rf "/build/fresh-editor-$upstream/debian"
          cp -r packaging/debian "/build/fresh-editor-$upstream/debian"
          echo "SRC=/build/fresh-editor-$upstream" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          cd "$SRC"
          apt-get build-dep -y ./

      - name: Build the source and binary packages
        run: |
          cd "$SRC"
          dpkg-buildpackage -us -uc

      - name: Lintian
        run: lintian --info --display-info --fail-on error /build/*.changes

      # The package's own autopkgtests (debian/tests), as ci.debian.net runs
      # them, on this container: without esbuild, the bundled plugins load and
      # init.ts gets the install hint; with it, init.ts checks out. esbuild is
      # a build dependency, so it is removed first, as on a user's system.
      - name: Install and run the autopkgtests
        run: |
          test "$(dpkg --print-architecture)" = "${{ matrix.arch }}"
          dpkg-deb --field /build/fresh-editor_*.deb Depends Recommends Suggests Built-Using Static-Built-Using
          apt-get install -y --no-install-recommends autopkgtest
          apt-get purge -y esbuild
          # The tests need only debian/; autopkgtest would copy the whole built
          # tree, target/ included.
          mkdir /autopkgtest-src
          cp -r "$SRC/debian" /autopkgtest-src/
          autopkgtest /build/fresh-editor_*.deb /autopkgtest-src -- null

      - name: Stage release assets
        if: ${{ inputs.release && matrix.suite == 'testing' }}
        run: |
          version=$(dpkg-parsechangelog -l "$SRC/debian/changelog" -S Version)
          upstream=${version%-*}
          mkdir -p /release
          cp "/build/fresh-editor_${version}_${{ matrix.arch }}.deb" \
            "/release/fresh-editor_${version}_${{ matrix.arch }}.debian-testing.deb"
          # The source package is the same from either architecture; one copy.
          if [ "${{ matrix.arch }}" = amd64 ]; then
            tar -czf "/release/fresh-editor_${version}.debian-testing-source.tar.gz" -C /build \
              "fresh-editor_${version}.dsc" \
              "fresh-editor_${upstream}.orig.tar.xz" \
              "fresh-editor_${version}.debian.tar.xz"
          fi
          cd /release
          for f in *; do sha256sum "$f" > "$f.sha256"; done
          ls -la

      - uses: actions/upload-artifact@v6
        if: ${{ inputs.release && matrix.suite == 'testing' }}
        with:
          name: artifacts-debian-testing-${{ matrix.arch }}
          if-no-files-found: error
          path: /release/*

      - uses: actions/upload-artifact@v6
        with:
          name: fresh-editor-debian-${{ matrix.suite }}-${{ matrix.arch }}
          if-no-files-found: error
          # Handy for trying a PR's package, not worth 90 days of storage.
          retention-days: ${{ github.event_name == 'pull_request' && 3 || 30 }}
          path: |
            /build/*.deb
            /build/*.dsc
            /build/*.tar.xz
            /build/*.buildinfo
            /build/*.changes
