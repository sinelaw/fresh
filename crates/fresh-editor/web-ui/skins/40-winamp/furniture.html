<!-- Winamp Classic — decorative furniture built inside the bezel host (#device).
     Plain HTML: the page keeps only div/span/i/b/em/strong/small/p elements,
     their class attributes and text. -->
<div class="dv-screen"></div>
<div class="wa-title">
  <i class="wa-rail"></i>
  <span class="wa-title-text">CODE STUDIO</span>
  <i class="wa-rail"></i>
  <span class="wa-wbtns">
    <i class="wa-min"></i>
    <i class="wa-shade"></i>
    <i class="wa-close"></i>
  </span>
</div>
<div class="wa-edge wa-l"></div>
<div class="wa-edge wa-r"></div>
<div class="wa-foot">
  <i class="wa-rail"></i>
</div>
<!-- The Orchestrator's own window, beside the player while the dock is open
     (shown by body.has-dock; the dock's panel sits in its well). -->
<div class="wa-dockwin">
  <div class="dv-screen"></div>
  <div class="wa-title">
    <i class="wa-rail"></i>
    <!-- room for the dock's own menu and close, which the skin moves up
         here: the menu is the window's caption -->
    <span class="wa-title-text wa-menuslot">ORCHESTRATOR MENU ▾</span>
    <i class="wa-rail"></i>
    <i class="wa-closeslot"></i>
  </div>
  <div class="wa-foot">
    <i class="wa-rail"></i>
    <span class="wa-foot-text">SESSIONS</span>
    <i class="wa-rail"></i>
  </div>
</div>
