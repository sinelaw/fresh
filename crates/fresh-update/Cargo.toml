[package]
name = "fresh-update"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Deterministic install provenance and self-update engine for the fresh editor: reads an install receipt (or embedded/heuristic fallback) to know exactly how fresh was installed, then updates through the same mechanism"
keywords = ["packaging", "self-update", "provenance", "installer", "cli"]
categories = ["command-line-utilities", "config"]

[lib]
name = "fresh_update"
path = "src/lib.rs"

# Test-only stand-in for `fresh`, used by tests/self_update_spine.rs to drive
# the real engine end to end. `insecure-endpoints` is never on in a published
# build, so this binary is never built for users.
[[bin]]
name = "update-harness"
path = "src/bin/update-harness.rs"
required-features = ["engine", "insecure-endpoints"]

[features]
default = []
# HTTP transport for the release feed and release assets. Pulls in the TLS
# stack (ureq + rustls + ring + webpki); off by default so a build that only
# needs provenance resolution stays dependency-light.
net = ["dep:ureq"]
# Archive extraction for the self-contained channels (tarball / AppImage).
archive = ["dep:tar", "dep:xz2", "dep:flate2", "dep:zip"]
# The full `fresh --cmd update` engine: resolve provenance, fetch the feed,
# download + verify, then delegate / install / swap.
engine = ["net", "archive"]
# Permit release endpoints outside the pinned host allowlist (plain http://,
# a local mirror). Test-only: with an override in effect the engine refuses to
# elevate, so a poisoned endpoint can never reach `sudo`. Never enable in a
# published build.
insecure-endpoints = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"
sha2 = "0.10"
tracing = { workspace = true }

ureq = { version = "3.1.4", default-features = false, features = [
    "rustls",
    "platform-verifier",
], optional = true }
tar = { version = "0.4", optional = true }
xz2 = { version = "0.1", optional = true }
# gzip for the universal (musl) archive. Default backend is miniz_oxide —
# pure Rust, unlike xz2 which links liblzma.
flate2 = { version = "1", optional = true }
zip = { version = "2", default-features = false, features = [
    "deflate",
], optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.25"
tiny_http = "0.12"
