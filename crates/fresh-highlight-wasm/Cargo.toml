[package]
name = "fresh-highlight-wasm"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "The web client's WebAssembly module, with a raw C ABI: fresh-highlight, fresh-markers and grapheme clusters"
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
fresh-highlight.workspace = true
fresh-markers.workspace = true
# `yaml-load` for the grammars `hl_build` adds.
syntect = { version = "5.3", default-features = false, features = ["parsing", "dump-load", "yaml-load", "regex-fancy"] }
# The terminal editor's measure of a character cell (fresh-core display_width).
unicode-width = "0.2"
unicode-segmentation = "1.12"

[dev-dependencies]
proptest = "1.9"
# The bundled syntaxes, for the `hl_*` tests' packdump.
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes"] }

[lints]
workspace = true
