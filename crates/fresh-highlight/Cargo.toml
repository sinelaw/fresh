[package]
name = "fresh-highlight"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "Incremental syntect highlighting of Fresh documents, shared by the editor and its web client"
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
# No regex engine here: the consumer picks one (`regex-onig` natively,
# `regex-fancy` in WebAssembly) and cargo's feature unification hands it to
# this crate's syntect.
# `yaml-load` for the grammars `build_syntax_set` adds.
syntect = { version = "5.3", default-features = false, features = ["parsing", "dump-load", "yaml-load"] }
# What syntect serializes a packdump with: `build_syntax_set` writes one in
# memory, which syntect only offers as a file.
bincode = "1.3"

[dev-dependencies]
# A regex engine, so the crate builds on its own for its tests, and the
# bundled syntaxes to test against.
syntect = { version = "5.3", default-features = false, features = ["parsing", "dump-load", "yaml-load", "default-syntaxes", "regex-fancy"] }
proptest = "1.9"

[lints]
workspace = true
