[package]
name = "fresh-quickjs-sys"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Raw FFI bindings to the system QuickJS library (Debian's libquickjs), generated at build time from the installed quickjs.h"
keywords = ["quickjs", "javascript", "ffi"]
categories = ["external-ffi-bindings"]

[lib]
name = "fresh_quickjs_sys"
path = "src/lib.rs"

# Spike (docs/internal/debian-quickjs-spike.md in the repo root): bindings are generated by
# bindgen against whatever quickjs.h is installed, rather than shipped
# pre-generated for a fixed list of targets, so every Debian architecture
# (including the 32-bit NaN-boxing ones) gets bindings that match its header.
[build-dependencies]
bindgen = { version = "0.72", default-features = false, features = ["runtime"] }
cc = "1.2"

