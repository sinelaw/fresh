[workspace]
resolver = "2"
members = [
    "crates/fresh-editor",
    "crates/fresh-editor-core",
    "crates/fresh-ui",
    "crates/fresh-gui",
    "crates/fresh-core",
    "crates/fresh-parser-js",
    "crates/fresh-languages",
    "crates/fresh-plugin-runtime",
    "crates/fresh-plugin-api-macros",
    "crates/fresh-winterm",
    "crates/fresh-input-parser",
    "crates/fresh-update",
    "crates/fresh-i18n",
]
default-members = [
    "crates/fresh-editor",
    "crates/fresh-editor-core",
    "crates/fresh-ui",
    "crates/fresh-core",
    "crates/fresh-parser-js",
    "crates/fresh-languages",
    "crates/fresh-plugin-runtime",
    "crates/fresh-plugin-api-macros",
    "crates/fresh-winterm",
    "crates/fresh-input-parser",
    "crates/fresh-update",
    "crates/fresh-i18n",
]

[workspace.package]
version = "0.4.10"
authors = ["Noam Lewis"]
edition = "2021"
license = "GPL-2.0-or-later"
repository = "https://github.com/sinelaw/fresh"
homepage = "https://sinelaw.github.io/fresh/"
documentation = "https://docs.rs/fresh-editor"

[workspace.dependencies]
# Local crates
fresh-core = { version = "0.4.10", path = "crates/fresh-core" }
# `default-features = false` has to be stated here, not just at the use site:
# cargo ignores a member's `default-features = false` unless the workspace
# entry sets it too (it warns, and calls it a future hard error). Without this,
# `fresh-editor --no-default-features` still pulled in this crate's defaults,
# and with them the whole bundled tree-sitter grammar set.
fresh-editor-core = { version = "0.4.10", path = "crates/fresh-editor-core", default-features = false }
fresh-gui = { version = "0.4.10", path = "crates/fresh-gui" }
fresh-parser-js = { version = "0.4.10", path = "crates/fresh-parser-js" }
fresh-languages = { version = "0.4.10", path = "crates/fresh-languages" }
fresh-plugin-runtime = { version = "0.4.10", path = "crates/fresh-plugin-runtime" }
fresh-plugin-api-macros = { version = "0.4.10", path = "crates/fresh-plugin-api-macros" }
fresh-winterm = { version = "0.4.10", path = "crates/fresh-winterm" }
fresh-input-parser = { version = "0.4.10", path = "crates/fresh-input-parser" }
fresh-update = { version = "0.4.10", path = "crates/fresh-update" }
fresh-ui = { version = "0.4.10", path = "crates/fresh-ui" }
fresh-i18n = { version = "0.4.10", path = "crates/fresh-i18n" }

# External crates
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
jsonc-parser = { version = "0.32", features = ["serde", "serde_json", "cst"] }
anyhow = { version = "1.0.100", default-features = false }
tokio = { version = "1.49", features = ["fs", "io-util", "process", "rt", "rt-multi-thread", "sync", "time", "macros"] }
once_cell = "1.20"
tracing = "0.1"
schemars = { version = "1.2", features = ["preserve_order"] }
rquickjs = { version = "0.11", features = ["futures", "macro"] }
rquickjs-serde = "0.5"
oxc_allocator = "0.128.0"
oxc_ast = "0.128.0"
oxc_parser = "0.128.0"
oxc_transformer = "0.128.0"
oxc_codegen = { version = "0.128.0", default-features = false }
oxc_span = "0.128.0"
oxc_semantic = "0.128.0"
oxc_diagnostics = "0.128.0"
oxc_isolated_declarations = "0.128.0"
tree-sitter = "0.26.5"
tree-sitter-highlight = "0.26.3"
crossterm = "0.29"
winit = "0.30"
wgpu = "28.0"
lsp-types = "0.97"
ts-rs = { version = "12.0", features = ["serde_json", "no-serde-warnings"] }
# Add more as needed during refactor

# Default (dev/test) profile, tuned for build speed.
#
# `debug = 0` is the single biggest lever in this workspace, because the
# tests are the expensive part of a build: `crates/fresh-editor/tests`
# alone is 59 integration-test files, and every one of them is a separate
# binary that statically links the whole editor and its dependency graph.
# At cargo's default `debug = true` each of those binaries carries a full
# copy of the DWARF for everything it links.
#
# Measured on a 4-core Linux box, `fresh-editor` + 10 of its integration
# tests, cold `target/` (debug = 2 -> debug = 0):
#
#   deps + lib compile         208s -> 153s   (-26%)
#   compile + link 10 tests    168s -> 126s   (-25%)
#   10 test binaries          5586MB -> 1236MB (-78%)
#   whole target/            12868MB -> 4879MB (-62%)
#   touch lib.rs, rebuild      33.2s -> 23.6s  (-29%)
#
# The disk figure is not a side note: extrapolated over all 78 test
# targets in the workspace, the default profile needs well over 40GB of
# `target/`, and `cargo build --tests` fails outright with "No space left
# on device" on a machine with 29GB free.
#
# The cost is that debug builds no longer carry line tables, so panics and
# `lldb`/`gdb` give function names but not file:line. When you need that
# for a debugging session, ask for it on the command line rather than
# putting it back here for everyone:
#
#   CARGO_PROFILE_DEV_DEBUG=line-tables-only cargo test -p fresh-editor ...
#   CARGO_PROFILE_DEV_DEBUG=2               cargo build          # full DWARF
#
# `debug-assertions` and `overflow-checks` are unaffected and stay on --
# this changes what the compiler *records*, not what it *checks*.
[profile.dev]
debug = 0

[profile.release]
debug = 0
lto = "fat"
codegen-units = 1
opt-level = "z"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"

# Size-optimized profile for producing a minimal `fresh` binary.
#
# Inherits everything from `release` (opt-level = "z", fat LTO,
# codegen-units = 1, no debug info) and adds the two flags that trade a
# little runtime/ergonomics for a smaller binary:
#
#   * panic = "abort" — drops the unwinding tables and landing pads. The
#     only `catch_unwind` in the tree is in `#[cfg(test)]` code, and the
#     plugin runtime signals errors without relying on Rust unwinding, so
#     aborting on panic does not change editor behaviour.
#   * strip = true     — strips symbols + debuginfo from the final binary.
#
# This profile does NOT change the normal `release` build. Pair it with a
# trimmed feature set for the smallest result, e.g.:
#
#   cargo build --profile min-size --no-default-features --features runtime
#
# which drops plugins, embedded plugins and all tree-sitter grammars while
# keeping syntect-based highlighting. See `crates/fresh-editor/Cargo.toml`.
[profile.min-size]
inherits = "release"
panic = "abort"
strip = true

# Optimize the critical dependencies in the plugin-load path at -O3 even
# in dev/test builds. These are the only deps where unoptimized code
# materially slows test wall time:
#
#   * oxc_*  — TypeScript→JS transpile + isolated-declarations emit,
#              dominant cost inside prepare_plugin.
#   * rquickjs / rquickjs-sys — the JavaScript runtime that runs every
#              plugin's top-level during plugin_exec.
#
# Our own crates still compile at -O0 + debug-info so incremental
# rebuilds stay fast. We avoid the wildcard `package."*"` form because
# rebuilding *every* transitive dep at -O3 was prohibitively slow on a
# cold build.
[profile.dev.package.oxc_allocator]
opt-level = 3
[profile.dev.package.oxc_ast]
opt-level = 3
[profile.dev.package.oxc_codegen]
opt-level = 3
[profile.dev.package.oxc_diagnostics]
opt-level = 3
[profile.dev.package.oxc_isolated_declarations]
opt-level = 3
[profile.dev.package.oxc_parser]
opt-level = 3
[profile.dev.package.oxc_semantic]
opt-level = 3
[profile.dev.package.oxc_span]
opt-level = 3
[profile.dev.package.oxc_transformer]
opt-level = 3
[profile.dev.package.rquickjs]
opt-level = 3
[profile.dev.package.rquickjs-sys]
opt-level = 3
[profile.dev.package.rquickjs-serde]
opt-level = 3

# Mirror the same overrides into the test profile, which `cargo test`
# and `cargo nextest run` use.
[profile.test.package.oxc_allocator]
opt-level = 3
[profile.test.package.oxc_ast]
opt-level = 3
[profile.test.package.oxc_codegen]
opt-level = 3
[profile.test.package.oxc_diagnostics]
opt-level = 3
[profile.test.package.oxc_isolated_declarations]
opt-level = 3
[profile.test.package.oxc_parser]
opt-level = 3
[profile.test.package.oxc_semantic]
opt-level = 3
[profile.test.package.oxc_span]
opt-level = 3
[profile.test.package.oxc_transformer]
opt-level = 3
[profile.test.package.rquickjs]
opt-level = 3
[profile.test.package.rquickjs-sys]
opt-level = 3
[profile.test.package.rquickjs-serde]
opt-level = 3
